[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopify-alibaba-ai-orchestrator"
version = "2.5.0"
description = "Gestionnaire terminal Shopify–Alibaba automatisé, déterministe, léger et sécurisé."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Jeffrey Althot"}]
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "rich>=13.9,<15",
  "psutil>=6.1,<8",
  "cryptography>=44,<47",
  "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
ai = [
  "scikit-learn>=1.6,<2",
  "numpy>=2.0,<3",
  "joblib>=1.4,<2"
]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "coverage>=7.6,<8"
]

[project.scripts]
commerce-orchestrator = "main:cli"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "app*", "config*", "api*", "domain*", "integrations*", "catalog*",
  "inventory*", "pricing*", "procurement*", "fulfillment*", "finance*",
  "compliance*", "ai*", "automation*", "analytics*", "workflows*", "workers*",
  "infrastructure*", "security*", "dashboard*", "cli*", "observability*",
  "reports*", "tools*", "orders*", "returns*", "risk*", "marketing*",
  "customers*", "customer_service*", "suppliers*", "supplier_intelligence*",
  "quality*", "tax*", "localization*", "sales_channels*", "store_management*"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[tool.setuptools.package-data]
config = ["**/*.yaml"]
ai = ["model_files/README.md"]
"integrations.alibaba" = ["contracts/*.json", "profiles/*.yaml"]
"integrations.shopify" = ["operations/**/*.graphql"]

